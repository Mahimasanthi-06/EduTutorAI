<!DOCTYPE html>
<html>
<head>
    <title>Quiz Generator | EduTutor AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center">📝 Quiz Generator</h2>

        <form method="POST">

            <div class="mb-3">
                <label>Enter a Topic</label>

                <input
                    type="text"
                    name="topic"
                    class="form-control"
                    placeholder="Example: DBMS">
            </div>

            <button class="btn btn-primary">
                Generate Quiz
            </button>

        </form>

        {% if quiz %}

        <hr>

        <h4>Generated Quiz</h4>
        <div class="alert alert-info">
    <pre style="white-space: pre-wrap; font-family: Arial;">
{{ quiz }}
    </pre>
</div>

       

        {% endif %}

    </div>

</div>

</body>
</html>
